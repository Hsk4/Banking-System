name: apk

# Manual runs build a debug APK for testing. Pushing a `v*` tag builds the
# release APK and attaches it to that tag's GitHub Release, which is where the
# published download lives (the APK is never committed to the repo).
on:
  workflow_dispatch:
  push:
    # both cases: the plan uses `v1.0.0` and this release is named `V.1.0.1`,
    # and glob filters are case-sensitive
    tags: ["v*", "V*"]

# `gh release create` needs to write the release
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: frontend }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run build:mobile && bunx cap sync android
        working-directory: frontend
        env: { NEXT_PUBLIC_API_URL: "${{ vars.API_URL }}" }

      # The release build is signed with the debug keystore, which
      # `android/app/keystore/` does not carry (it is git-ignored). The same
      # certificate is already public in the Android SDK, so generating it here
      # is reproducible and still lets the APK install over the previous build.
      - name: Debug keystore
        working-directory: frontend/android/app
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # `workflow_dispatch` builds the debug APK; a tag builds the release one
      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: banking-apk
          path: frontend/android/app/build/outputs/apk/**/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: frontend/android/app/build/outputs/apk/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app-release.apk "banking-system-${TAG}.apk"
          gh release create "$TAG" "banking-system-${TAG}.apk" \
            --repo "${{ github.repository }}" \
            --title "Banking $TAG" \
            --generate-notes
