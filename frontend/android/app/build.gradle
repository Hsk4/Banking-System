// The Capacitor-generated parts of this project (`app/capacitor.build.gradle`,
// `capacitor.settings.gradle` and the plugin modules) are gitignored and only
// appear after `bun run build:mobile` + `cap sync android`. Generate them when
// the checkout lacks them, so the APK builds from a fresh clone.
def capacitorFiles = [file('capacitor.build.gradle'), file('../capacitor.settings.gradle')]
if (capacitorFiles.any { !it.exists() }) {
    println 'Capacitor files missing - running `cap sync android`'
    exec {
        workingDir rootProject.projectDir.parentFile
        // bun runs the local cap binary, and the CI image already has it
        commandLine 'bun', 'run', 'cap', 'sync', 'android'
    }
}

apply plugin: 'com.android.application'

android {
    namespace = "com.bankingsystem.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bankingsystem.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // bumped for every published build: Android refuses to install an APK
        // whose versionCode is not higher than the one already on the device
        // the displayed version is V.1.0.1, but the build number stays above
        // the previously installed build so Android accepts the update
        versionCode 3
        versionName "V.1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Debug signing for the release build too, so `assembleRelease` produces an
    // installable APK without a keystore in the repo. Replace this with your own
    // signingConfig before publishing anywhere.
    signingConfigs {
        release {
            storeFile file("keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            // AGP 9 removed `proguard-android.txt` because it implies `-dontoptimize`.
            // The optimize file is used instead, with the same `-dontoptimize` kept in
            // proguard-rules.pro so release behaviour is unchanged.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
